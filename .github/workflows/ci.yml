name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep shellcheck ruby

      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: brew install ripgrep shellcheck

      - name: Run test suite
        run: make test
